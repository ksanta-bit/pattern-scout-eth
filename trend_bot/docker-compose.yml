services:
  trend-bot:
    build: .
    image: trend-bot:latest
    container_name: trend-bot
    restart: unless-stopped
    ports:
      - "8080:8080"          # dashboard: http://<ip-del-NAS>:8080
    volumes:
      - ./data:/data         # stato e dashboard persistono qui (sopravvive ai riavvii)
    environment:
      - STATE_DIR=/data
      - HTTP_PORT=8080
